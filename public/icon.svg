<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="teal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer subtle circular ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#2dd4bf" stroke-opacity="0.25" stroke-width="3" stroke-dasharray="8 6" />

  <!-- Inner glowing emblem -->
  <g transform="translate(256, 256)">
    <!-- Crescent Moon & Light -->
    <path d="M-20 -110 C40 -110 90 -70 90 0 C90 70 40 110 -20 110 C20 85 45 45 45 0 C45 -45 20 -85 -20 -110 Z" fill="url(#gold)" filter="url(#glow)" />
    
    <!-- Open Book / Mind Wings Motif -->
    <path d="M0 10 C-40 -15 -85 -10 -115 15 C-115 55 -85 80 0 95 C85 80 115 55 115 15 C85 -10 40 -15 0 10 Z" fill="url(#teal)" fill-opacity="0.9" />
    
    <!-- Central Spine / Torch of Knowledge -->
    <circle cx="0" cy="-30" r="16" fill="url(#gold)" />
    <path d="M-3 -10 L3 -10 L1 60 L-1 60 Z" fill="#ffffff" />
    
    <!-- Radiating gentle star / beacon -->
    <polygon points="0,-65 5,-50 20,-45 5,-40 0,-25 -5,-40 -20,-45 -5,-50" fill="#fef08a" />
  </g>
</svg>
